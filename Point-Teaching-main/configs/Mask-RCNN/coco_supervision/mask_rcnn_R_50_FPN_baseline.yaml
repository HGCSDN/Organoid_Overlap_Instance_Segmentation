_BASE_: "../Base-RCNN-FPN.yaml"

MODEL:
  META_ARCHITECTURE: "TwoStagePseudoLabGeneralizedRCNN"
  WEIGHTS: "./R-50.pkl"
  MASK_ON: True
  RESNETS:
    DEPTH: 50
  PROPOSAL_GENERATOR:
    NAME: "PseudoLabRPN"
  ROI_HEADS:
    NAME: "StandardROIHeadsPseudoLab"

DATASETS:
  TRAIN: ("coco_organoids_train",)
  TEST: ("coco_organoids_val",)

DATALOADER:
  NUM_WORKERS: 2

SOLVER:
  IMS_PER_BATCH: 2
  BASE_LR: 0.001
  MAX_ITER: 180000
  CHECKPOINT_PERIOD: 1000

SEMISUPNET:
  Trainer: "mask_rcnn_baseline"

TEST:
  EVAL_PERIOD: 1000
  EVALUATOR: "COCOeval"
